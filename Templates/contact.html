{% extends 'base.html' %}

{% block title %}Contact{% endblock %}

{% block content %}

<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-7 col-lg-6">

        <div class="card shadow border-0">

            <div class="card-body p-5">

                <h2 class="text-center mb-3 fw-bold text-primary">
                    Contact Us
                </h2>

                <p class="text-muted text-center mb-4">
                    Send us a message and we will get back to you.
                </p>

                <form method="POST" action="{{ url_for('contact') }}">

                    <div class="mb-3">
                        <label class="form-label">Your Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Enter your name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Your Email</label>
                        <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Subject</label>
                        <input type="text" name="subject" class="form-control" placeholder="Enter subject" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea name="message" rows="4" class="form-control" placeholder="Write your message..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Send Message
                    </button>

                </form>

                <div class="text-center mt-4">
                    <a href="{{ url_for('login') }}" class="btn btn-outline-secondary btn-sm">
                        Back to Login
                    </a>
                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
