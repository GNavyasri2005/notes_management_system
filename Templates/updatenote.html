{% extends 'base.html' %}

{% block title %}Update Note{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">

        <div class="card shadow">
            <div class="card-body p-4">

                <h3 class="text-center mb-4">
                    Update Note
                </h3>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">
                            Title
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            value="{{ note.title }}"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Content
                        </label>

                        <textarea
                            name="content"
                            rows="8"
                            class="form-control"
                            required>{{ note.content }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between">

                        <button
                            type="submit"
                            class="btn btn-warning">
                            Update Note
                        </button>

                        <a
                            href="{{ url_for('viewnotes') }}"
                            class="btn btn-secondary">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
