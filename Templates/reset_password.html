{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card shadow">
            <div class="card-body p-4">

                <h3 class="text-center mb-4">
                    Reset Password
                </h3>

                <form method="POST">

                    <div class="mb-3">
                        <label class="form-label">
                            New Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-success w-100">
                        Update Password
                    </button>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
